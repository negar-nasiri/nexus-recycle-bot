<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>اسکنر بازیافت نکسوس</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        body { font-family: Tahoma, sans-serif; text-align: center; background: #f4f9f4; padding: 20px; }
        #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 10px; overflow: hidden; }
        .result { margin-top: 20px; font-size: 18px; color: #2e7d32; font-weight: bold; }
    </style>
</head>
<body>

    <h2>🌱 اسکنر هوشمند نکسوس</h2>
    <p>دوربین را به سمت بارکد یا QR Code محصول بگیرید:</p>
    
    <div id="reader"></div>
    <div id="result" class="result"></div>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            // اینجا کدی که از بارکد خوانده شده را بررسی می‌کنیم
            document.getElementById('result').innerHTML = `✅ محصول اسکن شد! کد: ${decodedText}<br>در حال انتقال به راهنمای بازیافت...`;
            
            // می‌توانید کاربر را به صفحه اطلاعات محصول یا ربات هدایت کنید
            setTimeout(() => {
                alert("اطلاعات بازیافت این محصول: تفکیک پلاستیک و آلومینیوم");
            }, 1000);
        }

        let html5QrcodeScanner = new Html5QrcodeScanner(
            "reader", { fps: 10, qrbox: 250 }, false);
        html5QrcodeScanner.render(onScanSuccess);
    </script>

</body>
</html>
